<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-5 Math Practice Adventure</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-b from-blue-100 to-purple-100 min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="bg-white rounded-3xl shadow-xl p-6 w-full max-w-md text-center border-4 border-purple-400">
        <h1 class="text-3xl font-extrabold text-purple-600 mb-4 tracking-wide">✏️ Math Quest! 🎯</h1>
        
        <!-- Scoreboard -->
        <div class="flex justify-between items-center bg-yellow-100 rounded-full px-4 py-2 mb-6 border border-yellow-400">
            <span class="text-sm font-bold text-yellow-700">🔥 Streak: <span id="streak">0</span></span>
            <span class="text-sm font-bold text-green-700">⭐ Score: <span id="score">0</span></span>
        </div>

        <!-- Grade Selector -->
        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2">Select Your Grade:</label>
            <select id="gradeSelect" class="w-full bg-purple-50 border-2 border-purple-300 rounded-xl p-2 font-bold text-purple-700 focus:outline-none focus:border-purple-500">
                <option value="1">Grade 1 (Basic Add/Subtract)</option>
                <option value="2">Grade 2 (Double Digits)</option>
                <option value="3">Grade 3 (Multiplication)</option>
                <option value="4">Grade 4 (Division & Multi-Step)</option>
                <option value="5">Grade 5 (Decimals & Fractions)</option>
            </select>
        </div>

        <!-- Question Display Area -->
        <div class="bg-blue-50 border-2 border-blue-300 rounded-2xl p-6 mb-6">
            <p id="questionText" class="text-4xl font-black text-blue-700 tracking-wider">Loading...</p>
        </div>

        <!-- Answer Input -->
        <div class="mb-4">
            <input type="number" id="userAnswer" placeholder="Type answer here..." class="w-full text-center text-2xl font-bold p-3 border-4 border-gray-300 rounded-2xl focus:outline-none focus:border-green-400 mb-3">
            <button id="submitBtn" class="w-full bg-green-500 hover:bg-green-600 text-white font-black text-xl py-3 px-6 rounded-2xl shadow-md transition-all active:scale-95">SUBMIT ANSWER</button>
        </div>

        <!-- Feedback Message -->
        <p id="feedback" class="text-lg font-bold min-h-[1.5rem] mt-2"></p>
    </div>

    <!-- Link your game logic script -->
    <script src="app.js"></script>
</body>
</html>
