<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest Adventure</title>
    <!-- Rock-solid script to ensure the colorful graphics load on every phone/tablet -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen p-4 flex flex-col items-center justify-center selection:bg-pink-200">

    <!-- Main Game Console Box -->
    <div class="bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] p-6 w-full max-w-md text-center border-8 border-yellow-400 relative overflow-hidden transform transition-all duration-300">
        
        <!-- Fun Decorative Background Elements -->
        <div class="absolute -top-10 -left-10 w-24 h-24 bg-blue-200 rounded-full opacity-30 blur-xl"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-pink-200 rounded-full opacity-30 blur-xl"></div>

        <!-- Super Cool Game Title Header -->
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 mb-4 tracking-wide uppercase drop-shadow-sm flex items-center justify-center gap-2">
            🚀 Math Quest! 🎯
        </h1>
        
        <!-- Kids Arcade Scoreboard -->
        <div class="grid grid-cols-2 gap-3 mb-6 bg-slate-900 rounded-2xl p-3 border-2 border-slate-700 shadow-inner">
            <div class="bg-gradient-to-r from-orange-400 to-amber-500 rounded-xl py-2 px-3 text-white font-black text-sm shadow flex items-center justify-center gap-1">
                🔥 STREAK: <span id="streak" class="text-xl">0</span>
            </div>
            <div class="bg-gradient-to-r from-emerald-400 to-teal-500 rounded-xl py-2 px-3 text-white font-black text-sm shadow flex items-center justify-center gap-1">
                ⭐ SCORE: <span id="score" class="text-xl">0</span>
            </div>
        </div>

        <!-- Chunky Grade Selector Badge -->
        <div class="mb-6 bg-purple-50 rounded-2xl p-3 border-2 border-purple-200">
            <label class="block text-purple-700 text-xs font-black uppercase tracking-wider mb-1">🎯 Select Your Level</label>
            <select id="gradeSelect" class="w-full text-center bg-white border-4 border-purple-400 rounded-xl p-2 font-black text-purple-700 focus:outline-none focus:ring-4 focus:ring-purple-200 cursor-pointer text-base">
                <option value="1">🌈 Grade 1: Easy Add/Subtract</option>
                <option value="2">⚡ Grade 2: Double Digits</option>
                <option value="3">🌟 Grade 3: Multiplication</option>
                <option value="4">🔮 Grade 4: Fun Division</option>
                <option value="5">💎 Grade 5: Expert Decimals</option>
            </select>
        </div>

        <!-- Giant Magical Math Card Display -->
        <div class="bg-gradient-to-b from-blue-50 to-indigo-50 border-4 border-indigo-400 rounded-2xl p-8 mb-6 shadow-md relative group">
            <p id="questionText" class="text-5xl font-black text-indigo-700 tracking-wider drop-shadow-sm select-none">Loading...</p>
        </div>

        <!-- Interactive Kid-Friendly Answer Area -->
        <div class="space-y-4">
            <input type="number" pattern="[0-9]*" inputmode="decimal" id="userAnswer" placeholder="👉 Tap & type answer..." class="w-full text-center text-3xl font-black p-4 border-4 border-slate-300 bg-slate-50 rounded-2xl focus:outline-none focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-100 transition-all text-slate-800 placeholder:text-slate-400 shadow-inner">
            
            <button id="submitBtn" class="w-full bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white font-black text-2xl py-4 px-6 rounded-2xl shadow-[0_6px_0_#047857] hover:shadow-[0_4px_0_#047857] active:translate-y-1 active:shadow-none border-b-2 border-green-300 transition-all uppercase tracking-wide">
                Check My Answer! 👍
            </button>
        </div>

        <!-- Floating Animated Pop-up Feedback Message Box -->
        <div class="min-h-[4rem] flex items-center justify-center mt-4">
            <p id="feedback" class="text-xl font-black tracking-wide rounded-xl px-4 py-2 transition-all duration-200"></p>
        </div>
    </div>

    <!-- Script connection to run the math game engine -->
    <script src="app.js"></script>
</body>
</html>
