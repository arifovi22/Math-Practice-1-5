<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1 class="game-title">🚀 MATH QUEST 🎯</h1>
        
        <!-- Stats Row -->
        <div class="stats-box">
            <div class="stat-badge streak-badge">🔥 STREAK: <span id="streak">0</span></div>
            <div class="stat-badge score-badge">⭐ SCORE: <span id="score">0</span></div>
        </div>

        <!-- Progress Bar Level Tracker -->
        <div class="progress-section">
            <div class="progress-label">🌟 LEVEL PROGRESS:</div>
            <div class="progress-track">
                <div id="progressBar" class="progress-fill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Grade Selector Box -->
        <div class="selector-box">
            <label class="selector-label">SELECT YOUR MISSION:</label>
            <select id="gradeSelect">
                <option value="1">🌈 Grade 1: Easy Add / Subtract</option>
                <option value="2">⚡ Grade 2: Double Digits</option>
                <option value="3">🌟 Grade 3: Multiplication</option>
                <option value="4">🔮 Grade 4: Fun Division</option>
                <option value="5">💎 Grade 5: Expert Decimals</option>
            </select>
        </div>

        <!-- Interactive Flashcard -->
        <div class="math-card">
            <p id="questionText">Loading...</p>
        </div>

        <!-- Input Section -->
        <div class="input-container">
            <input type="number" pattern="[0-9]*" inputmode="decimal" id="userAnswer" placeholder="Tap to type answer...">
            <button id="submitBtn">CHECK MY ANSWER! 👍</button>
        </div>

        <!-- Feedback Alert message -->
        <p id="feedback"></p>

        <!-- Dynamic Step-by-Step Math Coach Box -->
        <div id="explanationBox" class="explanation-box hidden">
            <h3>💡 Math Coach Help:</h3>
            <p id="explanationText"></p>
            <button id="nextBtn" class="next-btn">Got it! Next Question ➡️</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
