<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest Academy</title>
    <style>
        /* --- ALL KID-FRIENDLY ARCADE STYLES --- */
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Confetti Particle Layer */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .game-container {
            background: white;
            border: 8px solid #facc15;
            border-radius: 30px;
            padding: 25px;
            width: 100%;
            max-w: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 15px;
            color: #4c1d95;
            text-shadow: 2px 2px #fef08a;
            letter-spacing: 1px;
        }

        .stats-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-badge {
            padding: 10px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: inset 0 -4px rgba(0,0,0,0.2);
        }

        .streak-badge { background: linear-gradient(to right, #f97316, #f59e0b); }
        .score-badge { background: linear-gradient(to right, #10b981, #06b6d4); }

        .progress-section {
            margin-bottom: 20px;
            text-align: left;
        }
        .progress-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #6b7280;
            margin-bottom: 5px;
        }
        .progress-track {
            background: #e5e7eb;
            border-radius: 20px;
            height: 20px;
            width: 100%;
            overflow: hidden;
            border: 2px solid #d1d5db;
        }
        .progress-fill {
            background: linear-gradient(to right, #22c55e, #10b981);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-out;
        }

        .selector-box {
            background: #f3e8ff;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #e9d5ff;
        }
        .selector-label {
            display: block;
            font-size: 0.75rem;
            color: #6b21a8;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        #gradeSelect {
            width: 100%;
            padding: 8px;
            border: 3px solid #c084fc;
            border-radius: 10px;
            font-weight: bold;
            color: #6b21a8;
            outline: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .math-card {
            background: linear-gradient(to bottom, #f0fdf4, #f0f9ff);
            border: 4px solid #3b82f6;
            border-radius: 20px;
            padding: 25px 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 0 #bfdbfe;
        }
        #questionText {
            font-size: 3.2rem;
            font-weight: 900;
            color: #1e3a8a;
            margin: 0;
        }

        .input-container input {
            width: 100%;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 12px;
            border: 4px solid #cbd5e1;
            border-radius: 15px;
            background: #f8fafc;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-container input:focus {
            border-color: #ec4899;
            background: white;
        }

        #submitBtn {
            width: 100%;
            background: #10b981;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 0 #047857;
            cursor: pointer;
            transition: all 0.1s;
        }
        #submitBtn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #047857;
        }
        #submitBtn:disabled {
            background: #94a3b8;
            box-shadow: 0 6px 0 #64748b;
            cursor: not-allowed;
        }

        #feedback {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 15px 0;
            min-height: 30px;
        }
        .correct-text { color: #10b981; }
        .wrong-text { color: #ef4444; }

        .explanation-box {
            background: #fef3c7;
            border: 4px dashed #f59e0b;
            border-radius: 20px;
            padding: 18px;
            margin-top: 15px;
            text-align: left;
            animation: fadeIn 0.3s ease-out;
        }
        .explanation-box h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #b45309;
            font-size: 1.2rem;
        }
        .explanation-box p {
            color: #78350f;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .understand-btn {
            width: 100%;
            background: #f59e0b;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b45309;
            transition: all 0.1s;
        }
        .understand-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b45309;
        }

        .hidden { display: none !important; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Confetti Canvas Background Layer -->
    <canvas id="confetti-canvas"></canvas>

    <div class="game-container">
        <h1 class="game-title">🚀 MATH QUEST 🎯</h1>
        
        <div class="stats-box">
            <div class="stat-badge streak-badge">🔥 STREAK: <span id="streak">0</span></div>
            <div class="stat-badge score-badge">⭐ SCORE: <span id="score">0</span></div>
        </div>

        <div class="progress-section">
            <div class="progress-label">🌟 LEVEL PROGRESS:</div>
            <div class="progress-track">
                <div id="progressBar" class="progress-fill"></div>
            </div>
        </div>

        <div class="selector-box">
            <label class="selector-label">Select Your Mission:</label>
            <select id="gradeSelect">
                <option value="1">🌈 Grade 1: Easy Add / Subtract</option>
                <option value="2">⚡ Grade 2: Double Digits</option>
                <option value="3">🌟 Grade 3: Multiplication</option>
                <option value="4">🔮 Grade 4: Fun Division</option>
                <option value="5">💎 Grade 5: Expert Decimals</option>
            </select>
        </div>

        <div class="math-card">
            <p id="questionText">Loading...</p>
        </div>

        <div class="input-container">
            <input type="number" pattern="[0-9]*" inputmode="decimal" id="userAnswer" placeholder="Tap to type answer...">
            <button id="submitBtn">CHECK MY ANSWER! 👍</button>
        </div>

        <p id="feedback"></p>

        <!-- Locked Lesson Screen Block -->
        <div id="explanationBox" class="explanation-box hidden">
            <h3>💡 Math Coach Help:</h3>
            <p id="explanationText"></p>
            <button id="understandBtn" class="understand-btn">I Understand! Next Question ➡️</button>
        </div>
    </div>

    <!-- --- COMPATIBLE BACKWARDS-SAFE GAME PARADIGM ENGINE --- -->
    <script>
        var score = 0;
        var streak = 0;
        var progress = 0;
        var currentAnswer = 0;
        var currentNum1 = 0;
        var currentNum2 = 0;
        var currentOp = '';

        var gradeSelect = document.getElementById("gradeSelect");
        var questionText = document.getElementById("questionText");
        var userAnswer = document.getElementById("userAnswer");
        var submitBtn = document.getElementById("submitBtn");
        var feedback = document.getElementById("feedback");
        var scoreDisplay = document.getElementById("score");
        var streakDisplay = document.getElementById("streak");
        var progressBar = document.getElementById("progressBar");
        var explanationBox = document.getElementById("explanationBox");
        var explanationText = document.getElementById("explanationText");
        var understandBtn = document.getElementById("understandBtn");

        // Confetti Canvas Traditional Engine
        var canvas = document.getElementById("confetti-canvas");
        var ctx = canvas.getContext("2d");
        var particles = [];
        var colors = ["#facc15", "#f43f5e", "#3b82f6", "#10b981", "#a855f7", "#f97316"];
        function resizeCanvas() {
            canvas.width = window.innerWidth;canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        function spawnConfetti() {
            for (var i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * canvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
                }
            animateConfetti();
        }
        var animationFrameId;
        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            var active = false;
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                p.tiltAngle += p.tiltAngleIncremental;
                p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle);
                p.tilt = Math.sin(p.tiltAngle - i / 3) * 15;
                if (p.y <= canvas.height) {
                    active = true;
                }
                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                ctx.stroke();
            }
            if (active) {
                animationFrameId = requestAnimationFrame(animateConfetti);
            } else {
                cancelAnimationFrame(animationFrameId);particles = [];
            }
        }
        function generateQuestion() {var grade = gradeSelect.value;userAnswer.value = "";feedback.innerText = "";feedback.className = "";explanationBox.classList.add("hidden");submitBtn.disabled = false;userAnswer.disabled = false;userAnswer.focus();if (grade === "1") {currentNum1 = Math.floor(Math.random() * 10) + 1;currentNum2 = Math.floor(Math.random() * 10) + 1;currentOp = Math.random() > 0.5 ? '+' : '-';if (currentOp === '-' && currentNum1 < currentNum2) {var temp1 = currentNum1;currentNum1 = currentNum2;currentNum2 = temp1;}currentAnswer = currentOp === '+' ? currentNum1 + currentNum2 : currentNum1 - currentNum2;questionText.innerText = currentNum1 + " " + currentOp + " " + currentNum2 + " = ?";} else if (grade === "2") {currentNum1 = Math.floor(Math.random() * 40) + 10;currentNum2 = Math.floor(Math.random() * 40) + 10;currentOp = Math.random() > 0.5 ? '+' : '-';if (currentOp === '-' && currentNum1 < currentNum2) {var temp2 = currentNum1;currentNum1 = currentNum2;currentNum2 = temp2;}currentAnswer = currentOp === '+' ? currentNum1 + currentNum2 : currentNum1 - currentNum2;questionText.innerText = currentNum1 + " " + currentOp + " " + currentNum2 + " = ?";} else if (grade === "3") {currentNum1 = Math.floor(Math.random() * 10) + 1;currentNum2 = Math.floor(Math.random() * 10) + 1;currentOp = '×';currentAnswer = currentNum1 * currentNum2;questionText.innerText = currentNum1 + " × " + currentNum2 + " = ?";} else if (grade === "4") {currentNum2 = Math.floor(Math.random() * 8) + 2;currentAnswer = Math.floor(Math.random() * 9) + 1;currentNum1 = currentNum2 * currentAnswer;currentOp = '÷';questionText.innerText = currentNum1 + " ÷ " + currentNum2 + " = ?";} else if (grade === "5") {currentNum1 = (Math.floor(Math.random() * 40) + 10) / 10;currentNum2 = (Math.floor(Math.random() * 40) + 10) / 10;currentOp = '+';currentAnswer = parseFloat((currentNum1 + currentNum2).toFixed(1));questionText.innerText = currentNum1 + " + " + currentNum2 + " = ?";}}function getCoachExplanation() {if (currentOp === '+') {if (gradeSelect.value === "5") {return "Let's line up the decimals! Look at " + currentNum1 + " and " + currentNum2 + ". Add the numbers behind the decimal point first, then add the whole numbers together. That gives us exactly " + currentAnswer + "!";}return "Let's count up! Start with the bigger number " + currentNum1 + ", and count forward " + currentNum2 + " more numbers. You will land right on " + currentAnswer + "!";} else if (currentOp === '-') {return "Let's take away! Imagine you have " + currentNum1 + " stars and you lose " + currentNum2 + " of them. You are left with exactly " + currentAnswer + " stars!";} else if (currentOp === '×') {return "Multiplication means adding equal groups! " + currentNum1 + " × " + currentNum2 + " means counting the number " + currentNum2 + " a total of " + currentNum1 + " times. That equals " + currentAnswer + "!";} else if (currentOp === '÷') {return "Division means sharing equally! Imagine sharing " + currentNum1 + " candies fairly among " + currentNum2 + " friends. Each friend gets exactly " + currentAnswer + " candies!";}return "Take your time, let's try the next one together!";}function checkAnswer() {var userIn = userAnswer.value;if (userIn === "") return;submitBtn.disabled = true;userAnswer.disabled = true;if (parseFloat(userIn) === currentAnswer) {feedback.innerText = "🎉 Way to go! Correct! 🌟";feedback.className = "correct-text";score += 10;streak += 1;progress = Math.min(progress + 20, 100);progressBar.style.width = progress + "%";if (progress >= 100) {feedback.innerText = "🏆 AMAZING! LEVEL UP! 🚀";spawnConfetti();progress = 0;setTimeout(function() { progressBar.style.width = "0%"; }, 1200);}setTimeout(generateQuestion, 2000);} else {feedback.innerText = "❌ Oops! The correct answer was " + currentAnswer;feedback.className = "wrong-text";streak = 0;progress = Math.max(progress - 10, 0);progressBar.style.width = progress + "%";explanationText.innerHTML = getCoachExplanation();explanationBox.classList.remove("hidden");}scoreDisplay.innerText = score;streakDisplay.innerText = streak;}gradeSelect.addEventListener("change", generateQuestion);submitBtn.addEventListener("click", checkAnswer);understandBtn.addEventListener("click", generateQuestion);userAnswer.addEventListener("keydown", function(e) {if (e.key === "Enter" && !submitBtn.disabled) checkAnswer();});generateQuestion();
